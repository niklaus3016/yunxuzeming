name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build web app
      run: npm run build
    
    - name: Sync web resources to Android
      run: npx cap sync android
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '21'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Gradle 8.14.3
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /opt
        ln -s /opt/gradle-8.14.3/bin/gradle /usr/local/bin/gradle
        gradle --version

    - name: Create keystore file from GitHub Secrets
      run: |
        cd android
        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Error: KEYSTORE_BASE64 secret is not set"
          exit 1
        fi
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-release-key.keystore
        ls -la my-release-key.keystore

    - name: Build Android Release APK
      run: |
        cd android
        gradle clean --no-daemon --no-wrapper
        gradle assembleRelease --no-build-cache --no-daemon --no-wrapper -Pandroid.injected.signing.store.file=my-release-key.keystore -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" -Pandroid.injected.signing.key.alias=yunxuzeming -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}"
        ls -la app/build/outputs/apk/release/

    - name: Build Android Debug APK
      run: |
        cd android
        gradle assembleDebug --no-daemon --no-wrapper
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
